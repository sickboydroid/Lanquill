<!-- SCREEN 1 : DETAILS -->
<div class="screen details" id="screen-details">
  <a id="prev-home">Prev</a>
  <div class="title">Details</div>

  <div class="content">
    <label for="input-name">
      Name
      <input id="input-name" type="text" minlength="5" placeholder="John Doe" />
    </label>

    <label for="input-phone">
      Phone
      <input
        id="input-phone"
        type="number"
        minlength="10"
        maxlength="10"
        placeholder="6005581476" />
    </label>

    <label for="input-enrollment">
      Enrollment
      <input
        id="input-enrollment"
        type="text"
        minlength="11"
        maxlength="11"
        placeholder="2025BCSE051" />
    </label>

    <label for="input-password">
      Lanquill Password
      <input id="input-password" type="text" placeholder="12345678" />
    </label>

    <label for="input-password2">
      Lanquill Password Again
      <input id="input-password2" type="text" placeholder="12345678" />
    </label>

    <ul class="notes">
      <li>Double check your enrollment</li>
      <li>
        Phone number is refunds in case you are not satisfied with the service
      </li>
    </ul>
  </div>
  <button id="next-pay">Next</button>
</div>
